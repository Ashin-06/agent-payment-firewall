# Firewall policy. Amounts in INR. Edit and restart; no code changes needed.

[limits]
per_transfer_max = 200000          # hard ceiling for one transfer
daily_total_max = 300000           # across transfers and bills, per customer per day
approval_above = 25000             # anything bigger needs the customer to confirm
max_payments_per_hour = 6
structuring_window_minutes = 60    # several payments just under approval_above inside this window
structuring_count = 3
structuring_band = 0.80            # "just under" = between 80% and 100% of approval_above
max_share_of_balance = 0.5         # one payment taking more than this share of the balance needs the customer to confirm
unusual_multiple = 5               # this many times the largest earlier payment to the same payee needs the customer to confirm
max_new_payees_per_day = 2         # more than this and new payees are refused until tomorrow

[new_payee]
cooldown_hours = 24                # payees younger than this are "new"
cooldown_max_without_approval = 10000

[untrusted]
# An amount that only appears in a bill/invoice (not typed by the customer) may be paid
# without confirmation up to this value, when the customer asked to pay that bill.
auto_pay_document_amount_max = 10000
# Untrusted content scoring at or above this injection score taints its values as hostile.
hostile_score = 4.0

[memo]
blocked_words = ["otp", "pin", "cvv", "password", "passcode", "upi pin", "one time password", "one time code",
                 "verification code", "secret", "aadhaar"]

[quiet_hours]
start = 0                          # local hour, inclusive
end = 5                            # exclusive; money movement inside needs approval
utc_offset_minutes = 330           # the bank's clock, so results don't depend on the server's timezone

[undo]
# Risky but permitted payments wait this long before the bank is called, so they can still be stopped:
# first payments to a new payee, and amounts taken from a document. 0 turns this off.
window_minutes = 10

[mandate]
ttl_minutes = 30                   # what the customer asked for lapses after this long
paste_score = 3.0                  # a customer message scoring this high is treated as pasted third-party text

[breaker]
max_refused_per_turn = 5           # refused or held calls before the assistant is stopped until the customer speaks
max_pending_approvals = 5          # open requests before new ones are refused, so nobody is flooded into approving
