name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: ruff check .
      - run: bandit -q -r agentfw -ll
      - run: pip-audit -r requirements.lock --no-deps --disable-pip --progress-spinner off
      - run: pytest -q --cov --cov-report=term-missing:skip-covered
      - run: python -m agentfw bench
      - run: python -m agentfw redteam --sessions 5000 --out /tmp/redteam.json
      - if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || true
